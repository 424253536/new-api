apiVersion: v1
kind: ConfigMap
metadata:
  name: new-api-config
  namespace: new-api
data:
  TZ: "Asia/Shanghai"

  # Do NOT set SQLITE_PATH: the built-in default already carries
  # busy_timeout(30000), journal_mode(WAL) and _txlock=immediate.

  # SQLite runs a single replica, so Redis is not required. Cache and rate
  # limits stay per-process; add REDIS_CONN_STRING later if you scale out.
  SYNC_FREQUENCY: "60"
  BATCH_UPDATE_ENABLED: "true"
  ERROR_LOG_ENABLED: "true"

  # HTTPS console: Secure refresh cookie plus strict refresh/logout origin
  # checks. Requires the exact public origin, no wildcard and no path.
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_TRUSTED_URL: "https://newapi.example.com"

  # Only needed if the console must log the real client IP behind the ingress.
  # Unset trusts loopback and RFC1918 ranges and logs a startup warning.
  # TRUSTED_PROXIES: "172.16.0.0/12"

  # Termination grace on the Pod is 150s, which must exceed this value.
  SHUTDOWN_TIMEOUT_SECONDS: "120"
