apiVersion: v1
kind: ConfigMap
metadata:
  name: new-api-config
  labels:
    app.kubernetes.io/name: new-api
data:
  TZ: "Asia/Shanghai"

  # 不要设 SQLITE_PATH：内置默认值已经带了
  # busy_timeout(30000)、journal_mode(WAL)、_txlock=immediate。

  # SQLite 单副本不需要 Redis，缓存和限流留在进程内。
  # 以后要扩多副本再加 REDIS_CONN_STRING。
  SYNC_FREQUENCY: "60"
  BATCH_UPDATE_ENABLED: "true"
  ERROR_LOG_ENABLED: "true"

  # HTTPS 控制台：启用 Secure Refresh Cookie 与严格的 refresh/logout Origin 校验。
  # 必须是精确的 HTTPS Origin，不支持通配符和路径。
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_TRUSTED_URL: "https://api.101zj.com"

  # 只有需要记录真实客户端 IP 时才配。不配会信任回环和 RFC1918 网段并在启动时告警。
  # TRUSTED_PROXIES: "172.16.0.0/12"

  # Pod 的 terminationGracePeriodSeconds 是 150s，必须大于这个值。
  SHUTDOWN_TIMEOUT_SECONDS: "120"
