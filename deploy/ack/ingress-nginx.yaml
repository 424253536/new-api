# 集群跑的是 Nginx Ingress Controller 时用这个文件：
# 把 kustomization.yaml 里的 ingress-alb.yaml 换成 ingress-nginx.yaml。
#
# 关闭响应缓冲并拉长读写超时是必须的，否则流式补全会分片或截断。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-api
  labels:
    app.kubernetes.io/name: new-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "128m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.101zj.com
      secretName: new-api-tls
  rules:
    - host: api.101zj.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: new-api
                port:
                  number: 80
