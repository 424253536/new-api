# 会话密钥由 deploy/ack/release.ps1 在首次发布时自动创建（已存在则不动，
# 轮换 SESSION_SECRET 会让所有登录态失效）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  labels:
    app.kubernetes.io/name: new-api
spec:
  replicas: 1
  # 云盘是 ReadWriteOnce，新 Pod 必须等旧 Pod 释放卷才能挂上。
  # 用滚动更新会卡在 ContainerCreating，所以 SQLite 方案只能用 Recreate。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: new-api
  template:
    metadata:
      labels:
        app: new-api
        app.kubernetes.io/name: new-api
    spec:
      # 必须大于 SHUTDOWN_TIMEOUT_SECONDS，否则长 SSE 流来不及收尾。
      terminationGracePeriodSeconds: 150
      # 若 ACR 仓库未被 aliyun-acr-credential-helper 覆盖，取消注释：
      # imagePullSecrets:
      #   - name: acr-credential
      containers:
        - name: new-api
          image: registry.cn-shanghai.aliyuncs.com/zhike/new-api:prod-v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: new-api-config
            - secretRef:
                name: new-api-secret
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # 默认日志目录 ./logs 解析为 /data/logs，跟数据一起持久化。不要传 --log-dir。
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            failureThreshold: 40
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: new-api-data
