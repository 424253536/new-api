apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-api
  labels:
    app.kubernetes.io/name: new-api
  annotations:
    # 证书用阿里云数字证书服务的 ID；若改用 tls.secretName，请删除 certificate-id 注解。
    alb.ingress.kubernetes.io/address-type: internet
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-id: REPLACE_WITH_CERTIFICATE_ID
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-enabled: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /api/status
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - host: api.101zj.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: new-api
                port:
                  number: 80
