<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>New API original liquid landscape asset renderer</title>
<style>html,body{margin:0;background:#111110}canvas{display:block}</style>
<canvas id="landscape" width="1600" height="600"></canvas>
<script>
// Original, seamless landscape footage. Baked to video so the app needs no
// WebGL runtime, animation library, or per-frame JavaScript for the banner.
const canvas = document.getElementById('landscape');
const gl = canvas.getContext('webgl', { antialias: true, preserveDrawingBuffer: true });
if (!gl) throw new Error('WebGL is required only to build the landscape assets');

const vertex = `
precision highp float;
attribute vec2 a_uv;
uniform float u_phase;
uniform float u_aspect;
varying vec3 v_position;
varying vec3 v_normal;
float elevation(vec2 p) {
  return 0.44 * sin(p.x * 0.65 + p.y * 0.60 - u_phase)
    + 0.22 * sin(p.x * 0.95 - p.y * 0.42 + u_phase * 2.0)
    + 0.10 * sin(p.x * 1.60 + p.y * 0.55 - u_phase * 3.0);
}
void main() {
  float distance = 0.25 + pow(a_uv.y, 1.55) * 18.75;
  vec2 ground = vec2(a_uv.x * distance * u_aspect * 0.53, distance);
  float height = elevation(ground);
  float dx = (elevation(ground + vec2(0.008, 0.0)) - elevation(ground - vec2(0.008, 0.0))) / 0.016;
  float dz = (elevation(ground + vec2(0.0, 0.008)) - elevation(ground - vec2(0.0, 0.008))) / 0.016;
  v_normal = normalize(vec3(-dx, 1.0, -dz));
  v_position = vec3(ground.x, height, distance);
  gl_Position = vec4(a_uv.x * 1.04 * distance,
    (height - 0.95) * 2.6 + 0.42 * distance,
    distance - 0.5, distance);
}`;
const fragment = `
precision highp float;
uniform float u_phase;
uniform float u_dark;
varying vec3 v_position;
varying vec3 v_normal;
void main() {
  vec3 background = mix(vec3(248.0,246.0,241.0), vec3(17.0,17.0,16.0), u_dark) / 255.0;
  float ridges = cos((v_position.z + v_position.x * 0.24) * 90.0
    + sin(v_position.x * 0.6 - u_phase) * 1.4);
  float detail = 1.0 - smoothstep(6.0, 13.0, v_position.z);
  vec3 normal = normalize(v_normal + vec3(ridges * 0.018, 0.0, ridges * 0.075) * detail);
  vec3 view = normalize(vec3(-v_position.x, 0.95 - v_position.y, -v_position.z));
  vec3 light = normalize(vec3(-0.45 + sin(u_phase) * 0.35, 0.85, 0.55));
  float diffuse = max(0.0, dot(normal, light));
  float specular = pow(max(0.0, dot(normal, normalize(light + view))), 72.0);
  float fresnel = pow(1.0 - max(0.0, dot(normal, view)), 3.0);
  vec3 shadow = mix(vec3(0.36,0.30,0.23), vec3(0.045,0.037,0.028), u_dark);
  vec3 middle = mix(vec3(0.72,0.63,0.48), vec3(0.28,0.20,0.12), u_dark);
  vec3 reflection = mix(vec3(0.99,0.98,0.92), vec3(1.0,0.82,0.54), u_dark);
  vec3 color = mix(shadow, middle, diffuse * 0.85);
  color = mix(color, reflection, clamp(fresnel * 0.48 + specular * 1.35, 0.0, 1.0));
  color += ridges * 0.016 * detail;
  float fog = smoothstep(4.0, 17.0, v_position.z);
  color = mix(color, background, fog * 0.97);
  gl_FragColor = vec4(color, 1.0);
}`;

function shader(kind, source) {
  const result = gl.createShader(kind);
  gl.shaderSource(result, source);
  gl.compileShader(result);
  if (!gl.getShaderParameter(result, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(result));
  return result;
}
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, vertex));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragment));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);
const columns = 240;
const rows = 120;
const points = [];
const indices = [];
for (let y = 0; y <= rows; y++) {
  for (let x = 0; x <= columns; x++) points.push(x / columns * 2 - 1, y / rows);
}
for (let y = 0; y < rows; y++) {
  for (let x = 0; x < columns; x++) {
    const a = y * (columns + 1) + x;
    const b = a + columns + 1;
    indices.push(a, b, a + 1, a + 1, b, b + 1);
  }
}
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(points), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'a_uv');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);
gl.enable(gl.DEPTH_TEST);
gl.uniform1f(gl.getUniformLocation(program, 'u_aspect'), canvas.width / canvas.height);
const phaseUniform = gl.getUniformLocation(program, 'u_phase');
const darkUniform = gl.getUniformLocation(program, 'u_dark');
window.renderFrame = (phase, dark) => {
  const background = dark ? [17,17,16] : [248,246,241];
  gl.clearColor(...background.map(value => value / 255), 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.uniform1f(phaseUniform, phase);
  gl.uniform1f(darkUniform, dark ? 1 : 0);
  gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);
  gl.finish();
  return canvas.toDataURL('image/png').split(',')[1];
};
window.renderFrame(0, true);
</script>
</html>
