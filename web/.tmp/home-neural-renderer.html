<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>New API original neural processor animation renderer</title>
<style>html,body{margin:0;background:#111110}canvas{display:block}</style>
<canvas id="neural" width="1600" height="600"></canvas>
<script>
// Offline artwork renderer. The homepage plays the encoded clip, not this code.
const canvas = document.getElementById('neural');
const ctx = canvas.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;
const nodes = [];
const edges = [];
let seed = 20261009;
function random() {
  seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}
for (let i = 0; i < 126; i++) {
  const y = 1 - 2 * (i + 0.5) / 126;
  const angle = i * Math.PI * (3 - Math.sqrt(5));
  const radius = Math.sqrt(1 - y * y);
  const density = 0.88 + random() * 0.12;
  nodes.push({
    x: Math.cos(angle) * radius * 325 * density,
    y: y * 164 * density,
    z: Math.sin(angle) * radius * 184 * density,
    size: 1.8 + random() * 1.7,
    phase: random() * TAU,
  });
}
for (let i = 0; i < nodes.length; i++) {
  const neighbours = nodes.map((node, j) => ({ j,
    distance: ((node.x - nodes[i].x) / 2) ** 2 +
      (node.y - nodes[i].y) ** 2 + (node.z - nodes[i].z) ** 2,
  })).filter(node => node.j !== i).sort((a, b) => a.distance - b.distance).slice(0, 4);
  for (const neighbour of neighbours) {
    if (neighbour.j > i) edges.push([i, neighbour.j]);
  }
}

function project(point, yaw = 0, pitch = 0) {
  const x = point.x * Math.cos(yaw) + point.z * Math.sin(yaw);
  const depth = -point.x * Math.sin(yaw) + point.z * Math.cos(yaw);
  const y = point.y * Math.cos(pitch) - depth * Math.sin(pitch);
  const z = point.y * Math.sin(pitch) + depth * Math.cos(pitch);
  const scale = 940 / (940 + z);
  return { x: 800 + x * scale, y: 325 + y * scale, z, scale };
}

function polygon(points, fill, stroke, width = 1) {
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
}

function gradient(from, to, stops) {
  const result = ctx.createLinearGradient(from.x, from.y, to.x, to.y);
  stops.forEach(([offset, color]) => result.addColorStop(offset, color));
  return result;
}

function bead(point, radius, dark, intensity = 1) {
  ctx.save();
  ctx.globalAlpha = intensity;
  const glow = ctx.createRadialGradient(point.x, point.y, 0, point.x, point.y, radius * 5);
  glow.addColorStop(0, dark ? '#efc38b66' : '#a671392b');
  glow.addColorStop(1, dark ? '#efc38b00' : '#a6713900');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(point.x, point.y, radius * 5, 0, TAU);
  ctx.fill();
  const body = ctx.createRadialGradient(point.x - radius * 0.35, point.y - radius * 0.4,
    0, point.x, point.y, radius);
  body.addColorStop(0, dark ? '#fff1d6' : '#fffaf0');
  body.addColorStop(0.32, dark ? '#e7b97d' : '#c49c6b');
  body.addColorStop(1, dark ? '#8b602f' : '#946435');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.arc(point.x, point.y, radius, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function curvePoint(t, a, b, c, d) {
  const s = 1 - t;
  return {
    x: s ** 3 * a.x + 3 * s * s * t * b.x + 3 * s * t * t * c.x + t ** 3 * d.x,
    y: s ** 3 * a.y + 3 * s * s * t * b.y + 3 * s * t * t * c.y + t ** 3 * d.y,
    z: s ** 3 * a.z + 3 * s * s * t * b.z + 3 * s * t * t * c.z + t ** 3 * d.z,
  };
}

function drawConnections(phase, dark) {
  for (const side of [-1, 1]) {
    for (let lane = 0; lane < 9; lane++) {
      const spread = (lane - 4) / 4;
      const a = { x: side * (620 + (lane % 3) * 63), y: spread * 178, z: (lane % 3 - 1) * 50 };
      const b = { x: side * 450, y: spread * 184 + 20 * Math.sin(phase + lane), z: 90 };
      const c = { x: side * 300, y: spread * 88, z: -12 };
      const d = { x: side * 105, y: spread * 82, z: -26 };
      const path = [];
      for (let i = 0; i <= 60; i++) path.push(project(curvePoint(i / 60, a, b, c, d)));
      ctx.beginPath();
      ctx.moveTo(path[0].x, path[0].y);
      path.slice(1).forEach(point => ctx.lineTo(point.x, point.y));
      ctx.lineWidth = lane % 3 === 0 ? 1.5 : 0.8;
      ctx.strokeStyle = gradient(path[0], path[path.length - 1], [
        [0, dark ? '#b0804840' : '#93663728'],
        [0.7, dark ? '#b9905b90' : '#9b713e60'],
        [1, dark ? '#e6b879a0' : '#a66f3860'],
      ]);
      ctx.stroke();
      bead(path[0], lane % 3 === 0 ? 4.5 : 2.8, dark, 0.8);

      for (let signal = 0; signal < 2; signal++) {
        let t = (phase / TAU * 2 + lane * 0.119 + signal * 0.5) % 1;
        if (side === 1) t = 1 - t;
        const point = project(curvePoint(t, a, b, c, d));
        const tail = project(curvePoint(Math.max(0, Math.min(1, t + side * 0.055)), a, b, c, d));
        ctx.strokeStyle = gradient(tail, point, [
          [0, dark ? '#f7d49a00' : '#a7713a00'],
          [1, dark ? '#ffe3b3ee' : '#936029cc'],
        ]);
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(tail.x, tail.y);
        ctx.lineTo(point.x, point.y);
        ctx.stroke();
        bead(point, 2.5, dark);
      }
    }
  }
}

function drawMesh(points, phase, dark, front) {
  for (let i = 0; i < edges.length; i++) {
    const [a, b] = edges[i].map(index => points[index]);
    const depth = (a.z + b.z) / 2;
    if ((depth < 0) !== front) continue;
    const opacity = front ? 0.33 : 0.11;
    ctx.strokeStyle = dark ? `rgba(223,180,120,${opacity})` : `rgba(147,103,53,${opacity})`;
    ctx.lineWidth = front ? 0.85 : 0.65;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    if (i % 8 === 0) {
      const t = (phase / TAU * 3 + i * 0.127) % 1;
      bead({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }, 1.9, dark, front ? 0.9 : 0.3);
    }
  }
  points.forEach((point, i) => {
    if ((point.z < 0) !== front) return;
    const energy = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(phase * 2 + nodes[i].phase));
    bead(point, nodes[i].size * point.scale, dark, energy * (front ? 0.85 : 0.28));
  });
}

function drawProcessor(phase, dark) {
  const yaw = -0.22 + Math.sin(phase) * 0.09;
  const pitch = 0.30 + Math.cos(phase) * 0.05;
  const lift = Math.sin(phase) * 7;
  const point = (x, y, z) => project({ x, y: y + lift, z }, yaw, pitch);
  const square = (radius, depth) => [point(-radius, -radius, depth), point(radius, -radius, depth),
    point(radius, radius, depth), point(-radius, radius, depth)];

  const halo = ctx.createRadialGradient(800, 345, 60, 800, 345, 225);
  halo.addColorStop(0, dark ? '#cf9b5033' : '#c9aa7a20');
  halo.addColorStop(1, dark ? '#cf9b5000' : '#c9aa7a00');
  ctx.fillStyle = halo;
  ctx.fillRect(520, 95, 560, 500);

  for (let layer = 4; layer >= 0; layer--) {
    const back = square(110, 18 + layer * 9);
    const front = square(110, 12 + layer * 9);
    polygon([back[1], back[2], front[2], front[1]], dark ? '#332d24' : '#aaa095', '#a98a5b66');
    polygon([back[2], back[3], front[3], front[2]], dark ? '#3e352a' : '#bbb0a2', '#bb985f66');
    polygon(front, dark ? '#272622' : '#dbd5cb', dark ? '#b7966055' : '#b5a282');
  }

  for (const side of [-1, 1]) {
    for (let i = -4; i <= 4; i++) {
      const x = side * 112;
      const pin = [point(x, i * 19 - 3, -4), point(x + side * 17, i * 19 - 3, -4),
        point(x + side * 17, i * 19 + 3, -4), point(x, i * 19 + 3, -4)];
      polygon(pin, gradient(pin[0], pin[2], [[0, '#705331'], [0.4, '#e0bd81'], [1, '#8c6a3e']]));
      const topPin = [point(i * 19 - 3, x, -4), point(i * 19 - 3, x + side * 14, -4),
        point(i * 19 + 3, x + side * 14, -4), point(i * 19 + 3, x, -4)];
      polygon(topPin, dark ? '#b78f55' : '#b9955e');
    }
  }

  const bevelBack = square(112, 6);
  const bevelFront = square(103, -13);
  for (let side = 0; side < 4; side++) {
    const next = (side + 1) % 4;
    const bevel = [bevelBack[side], bevelBack[next], bevelFront[next], bevelFront[side]];
    polygon(bevel, gradient(bevel[0], bevel[2], [
      [0, dark ? '#886943' : '#9a835e'],
      [0.42, dark ? '#ebc88e' : '#f4e7c8'],
      [1, dark ? '#594731' : '#8f794e'],
    ]));
  }
  const face = square(102, -13);
  polygon(face, gradient(face[0], face[2], [
    [0, '#393834'], [0.44, '#252521'], [0.78, '#1c1d1a'], [1, '#33332d'],
  ]), '#c4a57090', 1.2);

  const die = square(77, -14);
  polygon(die, gradient(die[0], die[2], [[0, '#33342f'], [1, '#20221e']]), '#89795688', 1);
  for (let i = -3; i <= 3; i++) {
    for (const side of [-1, 1]) {
      const a = point(side * 98, i * 23, -14);
      const b = point(side * 82, i * 23, -14);
      ctx.strokeStyle = '#bca16d7a';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      const c = point(i * 23, side * 98, -14);
      const d = point(i * 23, side * 82, -14);
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
    }
  }
  const origin = point(0, 0, -16);
  const axisX = point(1, 0, -16);
  const axisY = point(0, 1, -16);
  ctx.save();
  ctx.transform(axisX.x - origin.x, axisX.y - origin.y, axisY.x - origin.x, axisY.y - origin.y, origin.x, origin.y);
  ctx.font = '500 66px "Segoe UI", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f3d5a4';
  ctx.fillText('AI', 0, -1);
  ctx.restore();

  for (const corner of face) bead(corner, 2.3, dark, 0.72 + 0.18 * Math.sin(phase * 2));
}

window.renderFrame = (phase, dark) => {
  ctx.fillStyle = dark ? '#111110' : '#f8f6f1';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const points = nodes.map(node => project(node, phase, Math.sin(phase) * 0.09));
  drawConnections(phase, dark);
  drawMesh(points, phase, dark, false);
  drawMesh(points, phase, dark, true);
  drawProcessor(phase, dark);
  return canvas.toDataURL('image/png').split(',')[1];
};
window.renderFrame(0, true);
</script>
</html>
